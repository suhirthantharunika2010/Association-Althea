	<search>

    <label for="activites">Search 🔍</label>
    <input type="search" id="activites">
    <button type="submit">Rechercher</button>
  </form>
</search>

<script>
document.getElementById("searchForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let recherche = document.getElementById("activites").value.toLowerCase();

    if (recherche === "home") {
        window.location.href = "index.html";
    } else if (recherche === "activités"){
		window.location.href = "activity.html";
	} else if (recherche === "achat") {
        window.location.href = "achat.html";
    } else if (recherche === "casting") {
        window.location.href = "casting.html";
    } else {
        alert("Aucun résultat trouvé.");
    }
});
</script>
